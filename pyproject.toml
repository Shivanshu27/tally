[project]
name = "tally"
version = "0.1.0"
description = "A multi-tenant usage metering and quota platform with dual-path enforcement and gated reconciliation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shivanshu Singla" }]
keywords = ["metering", "quota", "usage-based-billing", "distributed-systems", "reconciliation"]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "structlog>=24.1,<26",
    "asyncpg>=0.29,<1",
    "redis>=5.0,<6",
    "aiokafka>=0.10,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]

[project.scripts]
tally = "tally.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tally"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes — strictly forbidden; timezone-aware required
    "T20",       # no print outside CLI
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
]
ignore = [
    "B008",      # FastAPI/Typer depend on call-in-default
    "N818",      # domain signal exceptions don't need Error suffix
    "E501",      # line length handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "S101", "DTZ001", "DTZ007"]
"src/tally/cli/**" = ["T20"]
"bench/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["tally"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]
files = ["src/tally", "bench", "tests"]

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "asyncpg.*",
    "redis.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires the docker-compose stack (Redpanda, Postgres, Redis)",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
filterwarnings = [
    "error",
    "ignore:.*unclosed.*:ResourceWarning",
    "ignore:.*loop is closed.*:ResourceWarning",
    "ignore:.*Exception ignored in.*:pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/tally"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------- import-linter
# Enforces hexagonal architecture and layering (ADR-0010)

[tool.importlinter]
root_package = "tally"

[[tool.importlinter.contracts]]
name = "Domain is pure (ADR-0010)"
type = "forbidden"
source_modules = ["tally.domain"]
forbidden_modules = [
    "tally.adapters",
    "tally.app",
    "tally.api",
    "tally.workers",
    "tally.cli",
    "tally.config",
]

[[tool.importlinter.contracts]]
name = "Layers point inward (ADR-0010)"
type = "layers"
layers = [
    "tally.cli",
    "tally.api",
    "tally.workers",
    "tally.config",
    "tally.app",
    "tally.adapters",
    "tally.domain",
]

[[tool.importlinter.contracts]]
name = "Only configuration root reads environment (ADR-0010)"
type = "forbidden"
source_modules = [
    "tally.domain",
    "tally.app",
    "tally.adapters",
]
forbidden_modules = ["tally.config"]
